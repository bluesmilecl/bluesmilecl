name: Animación de contribuciones

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente con los colores de BlueSmile
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1f4bff&color_dots=#ebedf0,#c7d6ff,#8fa9ff,#4d7cff,#1f4bff
            dist/snake-dark.svg?palette=github-dark&color_snake=#2fd49a&color_dots=#161b22,#0b2a5b,#1f4bff,#4d7cff,#2fd49a

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Actualiza la animación de contribuciones"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  @keyframes comet{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  @keyframes breath{from{opacity:.55}to{opacity:1}}
  .bl{font-size:14px;fill:#cbd5e1;font-weight:600}.bv{font-size:15px;fill:#ffffff;font-weight:800}.fill{transform-box:fill-box;transform-origin:left center}@keyframes grow{from{transform:scaleX(0)}}.star{transform-box:fill-box;transform-origin:center;animation:twinkle 3.5s ease-in-out infinite}@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}.sheen{animation:sheen 4.5s ease-in-out infinite}@keyframes sheen{0%{transform:translateX(-120px)}70%,100%{transform:translateX(340px)}}.f0{animation:grow 1.6s cubic-bezier(.2,.8,.2,1) 0.30s backwards}.f1{animation:grow 1.6s cubic-bezier(.2,.8,.2,1) 0.55s backwards}.f2{animation:grow 1.6s cubic-bezier(.2,.8,.2,1) 0.80s backwards}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

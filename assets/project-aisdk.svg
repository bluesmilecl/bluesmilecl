16.0" y="0" text-anchor="middle" class="prov">Cohere</text><circle cx="672" cy="-5" r="2.5" fill="#22d3ee" fill-opacity=".6"/><text x="728.0" y="0" text-anchor="middle" class="prov">Ollama</text><circle cx="784" cy="-5" r="2.5" fill="#22d3ee" fill-opacity=".6"/><text x="840.0" y="0" text-anchor="middle" class="prov">Groq</text><circle cx="896" cy="-5" r="2.5" fill="#22d3ee" fill-opacity=".6"/><text x="952.0" y="0" text-anchor="middle" class="prov">DeepSeek</text><circle cx="1008" cy="-5" r="2.5" fill="#22d3ee" fill-opacity=".6"/></g></g></g>
  <rect x="0" y="282" width="640" height="58" fill="url(#fadeL)"/>
</g>

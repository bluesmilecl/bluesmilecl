<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
<title id="t">AiSdk.Net</title>
<desc id="d">SDK open source para construir apps y agentes de IA en .NET 10: 7 proveedores, 15 paquetes, más de 200 tests.</desc>
<defs>
  <linearGradient id="bga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1c1147"/></linearGradient>
  <linearGradient id="bra" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <radialGradient id="gla"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <clipPath id="cla"><rect x="1" y="1" width="638" height="338" rx="16"/></clipPath>
</defs>
<g clip-path="url(#cla)">
  <rect width="640" height="340" fill="url(#bga)"/>
  <circle class="glowb" cx="580" cy="40" r="230" fill="url(#gla)"/>
</g>
<rect x="1" y="1" width="638" height="338" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
<rect class="comet" x="1" y="1" width="638" height="338" rx="16" fill="none" stroke="url(#bra)" stroke-width="2.5" stroke-linecap="round" pathLength="1000"/>
<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#140f33"/><stop offset=".12" stop-color="#140f33" stop-opacity="0"/><stop offset=".88" stop-color="#140f33" stop-opacity="0"/><stop offset="1" stop-color="#140f33"/></linearGradient>
<clipPath id="band"><rect x="1" y="282" width="638" height="57"/></clipPath></defs>
<style>
  text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,'DejaVu Sans',sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
  .title{font-size:30px;font-weight:800;fill:#ffffff;letter-spacing:-.3px}
  .tagl{font-size:16px;font-weight:600}
  .desc{font-size:15.5px;fill:#cbd5e1}
  .chipt{font-size:12.5px;font-weight:700;fill:#ffffff}
  .kpi{font-size:24px;font-weight:800;fill:#ffffff}
  .kpil{font-size:12.5px;fill:#94a3b8;font-weight:600}
  .comet{stroke-dasharray:110 890;animation:comet 7s linear infinite}
  .glowb{animation:breath 6s ease-in-out infinite alternate}
  @keyframes comet{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  @keyframes breath{from{opacity:.55}to{opacity:1}}
  .prov{font-size:14px;font-weight:700;fill:#e2e8f0}.marq{animation:marq 26s linear infinite}@keyframes marq{to{transform:translateX(-1008px)}}.spark{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="32" y="30" width="58" height="58" rx="14" fill="url(#lg)"/>
<path class="spark" d="M61 41 L65.5 54.5 L79 59 L65.5 63.5 L61 77 L56.5 63.5 L43 59 L56.5 54.5Z" fill="#ffffff"/>
<text x="106" y="58" class="title">AiSdk.Net</text>
<text x="106" y="83" class="tagl" fill="url(#tg)">SDK de IA y agentes para .NET 10</text>
<rect x="562" y="34" width="48" height="24" rx="12" fill="#22d3ee" fill-opacity=".22" stroke="#22d3ee" stroke-opacity=".6"/><text x="586.0" y="50.5" text-anchor="middle" class="chipt">MIT</text><rect x="482" y="34" width="72" height="24" rx="12" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa" stroke-opacity=".6"/><text x="518.0" y="50.5" text-anchor="middle" class="chipt">.NET 10</text><rect x="430" y="34" width="44" height="24" rx="12" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-opacity=".6"/><text x="452.0" y="50.5" text-anchor="middle" class="chipt">C#</text>
<text x="32" y="128" class="desc">Una sola API, independiente del proveedor, para texto, streaming,</text>
<text x="32" y="150" class="desc">objetos tipados, herramientas, agentes, multi-agente, RAG, MCP y workflows.</text>
<text x="32" y="212" class="kpi">7</text><text x="32" y="232" class="kpil">proveedores</text><text x="182" y="212" class="kpi">15</text><text x="182" y="232" class="kpil">paquetes NuGet</text><path d="M164 190V234" stroke="#ffffff" stroke-opacity=".1"/><text x="332" y="212" class="kpi">200+</text><text x="332" y="232" class="kpil">tests</text><path d="M314 190V234" stroke="#ffffff" stroke-opacity=".1"/><text x="482" y="212" class="kpi">0</text><text x="482" y="232" class="kpil">warnings</text><path d="M464 190V234" stroke="#ffffff" stroke-opacity=".1"/>
<g clip-path="url(#band)">
  <rect x="0" y="282" width="640" height="58" fill="#000000" fill-opacity=".22"/>
  <path d="M0 282.5H640" stroke="#ffffff" stroke-opacity=".08"/>
